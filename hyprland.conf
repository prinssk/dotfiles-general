# https://wiki.hyprland.org/Configuring/
# source = ~/.config/hypr/myColors.conf




# -------- Display <

monitor=DP-1, 1920x1080@60, 0x0, 1




# -------- Programs <

$terminal = kitty
$fileManager = dolphin
$menu = fuzzel
$menurun = fuzzel --show drun --counter
$wallp = ~/Downloads/1-images/anisave/vsrg/eepy.jpg
$ntf = swaync



# -------- Environments <

# exec-once = hyprlock
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once = swaybg -i $wallp
# exec-once = riseup-vpn
exec-once = hypridle

exec-once = $terminal & screenfetch
exec-once = wl-paste --watch cliphist store &

env = XCURSOR_SIZE,5
env = HYPRCURSOR_SIZE,5

env = WLR_NO_HARDWARE_CURSORS,1
env = LIBVA_DRIVER_NAME,nvidia
env = GBM_BACKEND,nvidia-drm
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = WLR_RENDERER,vulkan




# -------- Permissions <
# Please note permission changes here require a Hyprland restart and are not applied on-the-fly
# for security reasons

# ecosystem {
#   enforce_permissions = 1
# }

# permission = /usr/(bin|local/bin)/grim, screencopy, allow
# permission = /usr/(lib|libexec|lib64)/xdg-desktop-portal-hyprland, screencopy, allow
# permission = /usr/(bin|local/bin)/hyprpm, plugin, allow




# -------- Look and feel <

general {
    gaps_in = 3
    gaps_out = 6
    border_size = 2

    col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    col.inactive_border = rgba(33ccffee) rgba(595959aa) 45deg

    resize_on_border = true
    allow_tearing = false

    layout = dwindle
}

decoration {
    rounding = 10
    rounding_power = 1

    active_opacity = 1	
    inactive_opacity = 1

    blur {
        enabled = true
        size = 10
        passes = 1
        
        vibrancy = 0.67
    }
}

animations {
    enabled = yes, please :)

    bezier = easeOutQuint,0.23,1,0.32,1
    bezier = easeInOutCubic,0.65,0.05,0.36,1
    bezier = linear,0,0,1,1
    bezier = almostLinear,0.5,0.5,0.75,1.0
    bezier = quick,0.15,0,0.1,1

    animation = global, 1, 0.1, default
    animation = border, 1, 45.39, easeOutQuint
    animation = windows, 1, 0.79, easeOutQuint
    animation = windowsIn, 1, 1, easeOutQuint, popin 87%
    animation = windowsOut, 1, 1.49, linear, popin 87%
    animation = fadeIn, 1, 1.73, almostLinear
    animation = fadeOut, 1, 1.46, almostLinear
    animation = fade, 1, 23.03, quick
    animation = layers, 1, 3.81, easeOutQuint
    animation = layersIn, 1, 4, easeOutQuint, fade
    animation = layersOut, 1, 1.5, linear, fade
    animation = fadeLayersIn, 1, 1.79, almostLinear
    animation = fadeLayersOut, 1, 1.39, almostLinear
    animation = workspaces, 1, 1, almostLinear, fade
    animation = workspacesIn, 1, 0.2, almostLinear, fade
    animation = workspacesOut, 1, 2, almostLinear, fade
}

# Ref https://wiki.hyprland.org/Configuring/Workspace-Rules/
# "Smart gaps" / "No gaps when only"
# uncomment all if you wish to use that.
# workspace = w[tv1], gapsout:0, gapsin:0
# workspace = f[1], gapsout:0, gapsin:0
# windowrule = bordersize 0, floating:0, onworkspace:w[tv1]
# windowrule = rounding 0, floating:0, onworkspace:w[tv1]
# windowrule = bordersize 0, floating:0, onworkspace:f[1]
# windowrule = rounding 0, floating:0, onworkspace:f[1]

# See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
dwindle {
    pseudotile = true # Master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = true # You probably want this
}

# See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
master {
    new_status = master
}

# https://wiki.hyprland.org/Configuring/Variables/#misc
misc {
    force_default_wallpaper = -1
    disable_hyprland_logo = false
}




# -------- Input <

input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =
}




# -------- Binds <

# See https://wiki.hyprland.org/Configuring/Keywords/
$main = ALT
$main2 = SUPER
$main3 = CTRL

$window = $main
$workspace = ALT

bind = $main, N, exec, $terminal
bind = $main, W, killactive,

bind = $main2, L, exec, hyprlock

bind = $main2, V ,exec, cliphist list | wofi --dmenu | cliphist decode | wl-copy

bind = $main, M, changegroupactive,
bind = $main, E, exec, $fileManager
bind = $main2 SHIFT, R, exec, hyprctl reload
bind = $main, V, togglefloating
bind = $main, Q, exec, $menurun
bind = $main, S, togglesplit


bind = $main, J, movefocus, l
bind = $main, L, movefocus, r
bind = $main, I, movefocus, u
bind = $main, K, movefocus, d

# Workspace
bind = $workspace, 1, workspace, 1
bind = $workspace, 2, workspace, 2
bind = $workspace, 3, workspace, 3
bind = $workspace, 9, workspace, 4
bind = $workspace, 0, workspace, 5

# Scroll through existing workspaces with mainMod + scroll
bind = $window, D, workspace, e+1
bind = $window, A, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bind = $main, mouse:272, movewindow

# Laptop multimedia keys for volume and LCD brightness
# bindel = $main3 SHIFT, I, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
# bindel = $main3 SHIFT, K, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
# bindel = $main3 SHIFT, J, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
# bindel = $main3 SHIFT, L, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

# Requires playerctl
# bindl = , XF86AudioNext, exec, playerctl --all-players play-pause #pause all
# bindl = , XF86AudioPause, exec, ~/.scripts/volume.sh mute #mute audio
# bindl = , XF86AudioPlay, exec, playerctl play-pause
# bindl = , XF86AudioPrev, exec, playerctl previous

# -------- Workspace <
windowrule = float, pin, size 800 400, move 0 0, class:$terminal, initialTitle:$terminal
windowrule = animation popin, class:$terminal

